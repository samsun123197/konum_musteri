<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kullanıcı Girişi</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 360px;
        }
        .login-card h2 {
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        .form-group input:focus {
            outline: none;
            border-color: #007bff;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        .error-message {
            color: #dc3545;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Giriş Yap</h2>
    <form id="loginForm">
        <div class="form-group">
            <label for="username">Kullanıcı Adı</label>
            <input type="text" id="username" required>
        </div>
        <div class="form-group">
            <label for="password">Şifre</label>
            <input type="password" id="password" required>
        </div>
        <button type="submit">Giriş</button>
        <div id="errorMessage" class="error-message">Kullanıcı adı veya şifre hatalı!</div>
    </form>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const userInput = document.getElementById('username').value.trim();
    const passInput = document.getElementById('password').value.trim();
    const errorDiv = document.getElementById('errorMessage');

    try {
        // kullanicilar.txt dosyasını oku
        const response = await fetch('kullanicilar.txt');
        if (!response.ok) throw new Error('Kullanıcı dosyası bulunamadı.');
        
        const text = await response.text();
        const lines = text.split('\n');
        
        let authenticated = false;

        for (let line of lines) {
            const trimmedLine = line.trim();
            if (!trimmedLine || trimmedLine.startsWith('#')) continue;
            
            const [user, pass] = trimmedLine.split(':');
            if (user && pass && user.trim() === userInput && pass.trim() === passInput) {
                authenticated = true;
                break;
            }
        }

        if (authenticated) {
            // Giriş başarılı: Oturumu kaydet ve ana sayfaya yönlendir
            sessionStorage.setItem('isLoggedIn', 'true');
            sessionStorage.setItem('username', userInput);
            window.location.href = 'index.html';
        } else {
            errorDiv.style.display = 'block';
        }
    } catch (err) {
        alert('Giriş yapılırken bir hata oluştu: ' + err.message);
    }
});
</script>

</body>
</html>
